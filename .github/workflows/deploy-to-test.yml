name: Deploy to TEST Environment

# Manual trigger for TEST deployment using fabric-cicd.
# Resumes capacities before deployment and suspends after (cost optimization).
#
# Modes:
#   Normal deploy : fabric-cicd deploy, ingen SQL, valgfritt setup notebook
#   Full init     : fabric-cicd deploy, SQL 01-07 (reset!), setup notebook
#
# After deploy, Variable Library is automatically updated with live Fabric
# values (SQL Database endpoint, Environment ID etc.)
on:
  workflow_dispatch:
    inputs:
      full_init:
        description: 'Full init/reset - SQL 01-07 + lakehouse setup (ADVARSEL: sletter all data!)'
        type: boolean
        default: false
      run_workspace_setup:
        description: 'Kjør setup notebook - init lakehouses (ignoreres hvis full_init=true)'
        type: boolean
        default: false
      run_unit_tests:
        description: 'Run unit tests after deployment'
        type: boolean
        default: true
      skip_capacity_suspend:
        description: 'Skip capacity suspend (leave running for debugging)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  deploy-to-test:
    name: Deploy to TEST
    runs-on: windows-latest

    env:
      AZURE_CLIENT_ID: ${{ secrets.SPN_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.SPN_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TEST_DATASTORES_WORKSPACE_ID: ${{ vars.TEST_DATASTORES_WORKSPACE_ID }}
      TEST_PROCESSING_WORKSPACE_ID: ${{ vars.TEST_PROCESSING_WORKSPACE_ID }}
      TEST_CONSUMPTION_WORKSPACE_ID: ${{ vars.TEST_CONSUMPTION_WORKSPACE_ID }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      GITHUB_ACTIONS: true
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e config/
          pip install -r config/requirements.txt
          pip show fabric-cicd
        shell: pwsh

      - name: Install ODBC Driver
        run: choco install sqlserver-odbcdriver -y
        shell: pwsh

      - name: Resume TEST capacities
        run: |
          python config/scripts/manage_capacity.py `
            --environment TEST --action resume --wait
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 1: Deploy all Fabric items (Notebooks, Pipelines, Lakehouse, etc.)
      # -----------------------------------------------------------------------
      - name: Deploy all workspaces to TEST
        run: |
          python config/scripts/deploy_with_fabric_cicd.py `
            --environment TEST --all-workspaces
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 2: Update Variable Library with live Fabric values
      # Runs after every deploy to keep Variable Library in sync with
      # current SQL Database endpoint, Environment ID etc.
      # Commits updated valueSet/TEST.json back to Git automatically.
      # -----------------------------------------------------------------------
      - name: Update Variable Library
        run: |
          python config/scripts/update_variable_library.py `
            --environment TEST `
            --processing-workspace-id ${{ vars.TEST_PROCESSING_WORKSPACE_ID }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      # -----------------------------------------------------------------------
      # Step 3: Wait for SQL Database to be fully provisioned (full init only)
      # -----------------------------------------------------------------------
      - name: Wait for SQL Database to be ready
        if: ${{ inputs.full_init }}
        run: |
          Write-Host "Waiting 90 seconds for SQL Database to be provisioned..."
          Start-Sleep -Seconds 90
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 4: Full init/reset - SQL 01-07
      # Kjøres kun ved full_init=true
      # 01 sletter all data, 07 seeder metadata (idempotent)
      # -----------------------------------------------------------------------
      - name: Deploy SQL Database - full init
        if: ${{ inputs.full_init }}
        run: |
          python config/scripts/deploy_sql_database.py `
            --environment TEST `
            --workspace-id ${{ vars.TEST_PROCESSING_WORKSPACE_ID }}
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 5: Setup notebook
      # Kjøres ved full_init=true eller run_workspace_setup=true
      # init_lakehouses=True  - oppretter lakehouses
      # init_metadata_sql=False - metadata er allerede seedet av SQL 07
      # run_pipeline=True     - kjør ETL pipeline etter init
      # -----------------------------------------------------------------------
      - name: Run workspace setup
        if: ${{ inputs.full_init || inputs.run_workspace_setup }}
        run: |
          $env:NOTEBOOK_PARAMS = '{"init_lakehouses": true, "init_metadata_sql": false, "run_pipeline": true}'
          python config/scripts/run_fabric_notebook.py `
            --workspace-id ${{ vars.TEST_PROCESSING_WORKSPACE_ID }} `
            --notebook-id ${{ vars.TEST_SETUP_NOTEBOOK_ID }} `
            --timeout 60 `
            --params $env:NOTEBOOK_PARAMS
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 6: Run unit tests
      # -----------------------------------------------------------------------
      - name: Run unit tests
        if: ${{ inputs.run_unit_tests }}
        run: |
          python config/scripts/run_fabric_notebook.py `
            --workspace-id ${{ vars.TEST_PROCESSING_WORKSPACE_ID }} `
            --notebook-id ${{ vars.TEST_UNIT_TESTS_NOTEBOOK_ID }}
        shell: pwsh

      # -----------------------------------------------------------------------
      # Always: Suspend capacities (cost optimization)
      # -----------------------------------------------------------------------
      - name: Suspend TEST capacities
        if: ${{ always() && !inputs.skip_capacity_suspend }}
        run: |
          python config/scripts/manage_capacity.py `
            --environment TEST --action suspend
        shell: pwsh