name: Create Feature Workspaces

on:
  workflow_dispatch:
    inputs:
      feature_branch_name:
        description: "Feature branch name (e.g., feature_new-api)"
        required: true
        type: string
      workspaces_to_be_created:
        description: "Workspaces types (comma-separated: processing,datastores,consumption)"
        required: true
        type: string
        default: "processing,datastores"

jobs:
  create-feature-workspaces:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B ${{ inputs.feature_branch_name }}
          mkdir -p solution/processing solution/datastores solution/consumption
          touch solution/processing/.gitkeep
          touch solution/datastores/.gitkeep
          touch solution/consumption/.gitkeep
          git add solution/
          git diff --staged --quiet || git commit -m "add solution folder structure"
          git push -u origin ${{ inputs.feature_branch_name }} --force
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip & requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt

      - name: Create feature workspaces
        run: python config/scripts/create_feature_workspaces.py
        env:
          PYTHONPATH: config
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          FEATURE_BRANCH_NAME: ${{ inputs.feature_branch_name }}
          WORKSPACES_TO_CREATE: ${{ inputs.workspaces_to_be_created }}
          AZURE_CLIENT_ID: ${{ secrets.SPN_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.SPN_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          CONFIG_FILE: config/v01/v01-template.yml