name: Deploy to PROD Environment

# Manual trigger for PROD deployment using fabric-cicd.
# Includes approval gate via GitHub Environments.
# Resumes capacities before deployment and suspends after (cost optimization).
#
# Modes:
#   Normal deploy : fabric-cicd deploy, ingen SQL, valgfritt setup notebook
#   Full init     : fabric-cicd deploy, SQL 01-07 (reset!), setup notebook
#
# Versioning:
#   Bruk samme source_version som ble deployet til TEST (f.eks. v1.5).
#   Workflowen oppretter prod/v1.5 etter vellykket deploy.
on:
  workflow_dispatch:
    inputs:
      source_version:
        description: 'Git tag å deploye, f.eks. v1.5 — bruk samme som i TEST'
        required: true
        default: ''
      skip_approval:
        description: 'Skip manual approval (emergency only)'
        type: boolean
        default: false
      full_init:
        description: 'Full init/reset - SQL 01-07 + lakehouse setup (ADVARSEL: sletter all data!)'
        type: boolean
        default: false
      run_workspace_setup:
        description: 'Run workspace setup notebook (ignoreres hvis full_init=true)'
        type: boolean
        default: false
      skip_orphan_cleanup:
        description: 'Skip orphan item cleanup (safer for PROD)'
        type: boolean
        default: true
      skip_capacity_suspend:
        description: 'Skip capacity suspend (leave running)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  approval:
    name: Approval Gate
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_approval }}
    environment: production
    steps:
      - run: echo "Approved by ${{ github.actor }}"

  deploy-to-prod:
    name: Deploy to PROD
    needs: [approval]
    if: ${{ always() && (needs.approval.result == 'success' || inputs.skip_approval) }}
    runs-on: windows-latest

    env:
      AZURE_CLIENT_ID: ${{ secrets.SPN_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.SPN_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PROD_DATASTORES_WORKSPACE_ID: ${{ vars.PROD_DATASTORES_WORKSPACE_ID }}
      PROD_PROCESSING_WORKSPACE_ID: ${{ vars.PROD_PROCESSING_WORKSPACE_ID }}
      PROD_CONSUMPTION_WORKSPACE_ID: ${{ vars.PROD_CONSUMPTION_WORKSPACE_ID }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      GITHUB_ACTIONS: true
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ inputs.source_version }}
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e config/
          pip install -r config/requirements.txt
          pip show fabric-cicd
        shell: pwsh

      - name: Install ODBC Driver
        if: ${{ inputs.full_init }}
        run: choco install sqlserver-odbcdriver -y
        shell: pwsh

      - name: Resume PROD capacities
        run: |
          python config/scripts/manage_capacity.py `
            --environment PROD --action resume --wait
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 1: Deploy all Fabric items to PROD
      # -----------------------------------------------------------------------
      - name: Deploy all workspaces to PROD
        run: |
          $cleanup = if ("${{ inputs.skip_orphan_cleanup }}" -eq "true") { "--no-cleanup" } else { "" }
          python config/scripts/deploy_with_fabric_cicd.py `
            --environment PROD --all-workspaces $cleanup
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 2: Update Variable Library with live Fabric values
      # -----------------------------------------------------------------------
      - name: Update Variable Library
        run: |
          python config/scripts/update_variable_library.py `
            --environment PROD `
            --processing-workspace-id ${{ vars.PROD_PROCESSING_WORKSPACE_ID }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      # -----------------------------------------------------------------------
      # Step 3: Wait for SQL Database (full init only)
      # -----------------------------------------------------------------------
      - name: Wait for SQL Database to be ready
        if: ${{ inputs.full_init }}
        run: |
          Write-Host "Waiting 3 minutes for SQL Database and PROD capacity to be ready..."
          Start-Sleep -Seconds 180
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 4: Full init/reset - SQL 01-07 (full init only)
      # -----------------------------------------------------------------------
      - name: Deploy SQL Database - full init
        if: ${{ inputs.full_init }}
        run: |
          python config/scripts/deploy_sql_database.py `
            --environment PROD `
            --workspace-id ${{ vars.PROD_PROCESSING_WORKSPACE_ID }}
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 5: Setup notebook
      # Kjøres ved full_init=true eller run_workspace_setup=true
      # init_lakehouses=True  - oppretter lakehouses
      # init_metadata_sql=False - metadata er allerede seedet av SQL 07
      # run_pipeline=False    - ikke kjør pipeline ved første deploy i PROD
      # -----------------------------------------------------------------------
      - name: Run workspace setup
        if: ${{ inputs.full_init || inputs.run_workspace_setup }}
        run: |
          $env:NOTEBOOK_PARAMS = '{"init_lakehouses": true, "init_metadata_sql": false, "run_pipeline": false}'
          python config/scripts/run_fabric_notebook.py `
            --workspace-id ${{ vars.PROD_PROCESSING_WORKSPACE_ID }} `
            --notebook-id ${{ vars.PROD_SETUP_NOTEBOOK_ID }} `
            --timeout 60 `
            --params $env:NOTEBOOK_PARAMS
        shell: pwsh

      # -----------------------------------------------------------------------
      # Step 6: Tag denne PROD-deployen med prod/{source_version}
      # Opprettes kun ved suksess. Hvis taggen allerede finnes (re-deploy av
      # samme versjon) hoppes den over uten feil.
      # Eksempel: source_version=v1.5 → prod/v1.5
      # -----------------------------------------------------------------------
      - name: Create PROD version tag
        run: |
          $sourceTag = "${{ inputs.source_version }}"
          $prodTag   = "prod/$sourceTag"

          git fetch --tags --quiet

          if (git tag -l $prodTag) {
            Write-Host "Tag $prodTag eksisterer allerede — ingen endring"
          } else {
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag $prodTag
            git push origin $prodTag
            Write-Host "✅ Tagged PROD deploy as: $prodTag"
          }

          echo "DEPLOY_TAG=$prodTag" >> $env:GITHUB_ENV
        shell: pwsh

      # -----------------------------------------------------------------------
      # Always: Suspend capacities (cost optimization)
      # -----------------------------------------------------------------------
      - name: Suspend PROD capacities
        if: ${{ always() && !inputs.skip_capacity_suspend }}
        run: |
          python config/scripts/manage_capacity.py `
            --environment PROD --action suspend
        shell: pwsh

      # -----------------------------------------------------------------------
      # Always: Print deploy summary
      # -----------------------------------------------------------------------
      - name: Deploy summary
        if: always()
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host " PROD DEPLOY SUMMARY"
          Write-Host "========================================="
          Write-Host " Tag             : $env:DEPLOY_TAG"
          Write-Host " Source version  : ${{ inputs.source_version }}"
          Write-Host " Full init       : ${{ inputs.full_init }}"
          Write-Host " Workspace setup : ${{ inputs.full_init || inputs.run_workspace_setup }}"
          Write-Host " Approved by     : ${{ github.actor }}"
          Write-Host "========================================="
        shell: pwsh
