name: Deploy Fabric Solution from Template

# Provisions all Fabric infrastructure from the YAML template.
# After provisioning, automatically updates GitHub Variables with live
# resource IDs so no manual intervention is needed.
#
# Run this workflow when:
#   - First time setting up a new solution
#   - Adding new environments
#   - Recreating workspaces after deletion
on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Path to configuration template file"
        required: false
        type: string
        default: "config/v01/v01-template.yml"
      environment:
        description: "Environment to update GitHub Variables for (or 'all')"
        required: false
        type: choice
        options:
          - all
          - TEST
          - PROD
          - DEV
        default: "all"

jobs:
  deploy-fabric-infrastructure:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.SPN_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.SPN_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      SPN_OBJECT_ID: ${{ secrets.SPN_OBJECT_ID }}
      GITHUB_PAT: ${{ secrets.GH_PAT }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      DEV_PROCESSING_WORKSPACE_ID: ${{ vars.DEV_PROCESSING_WORKSPACE_ID }}
      DEV_DATASTORES_WORKSPACE_ID: ${{ vars.DEV_DATASTORES_WORKSPACE_ID }}
      DEV_CONSUMPTION_WORKSPACE_ID: ${{ vars.DEV_CONSUMPTION_WORKSPACE_ID }}
      TEST_PROCESSING_WORKSPACE_ID: ${{ vars.TEST_PROCESSING_WORKSPACE_ID }}
      TEST_DATASTORES_WORKSPACE_ID: ${{ vars.TEST_DATASTORES_WORKSPACE_ID }}
      TEST_CONSUMPTION_WORKSPACE_ID: ${{ vars.TEST_CONSUMPTION_WORKSPACE_ID }}
      PROD_PROCESSING_WORKSPACE_ID: ${{ vars.PROD_PROCESSING_WORKSPACE_ID }}
      PROD_DATASTORES_WORKSPACE_ID: ${{ vars.PROD_DATASTORES_WORKSPACE_ID }}
      PROD_CONSUMPTION_WORKSPACE_ID: ${{ vars.PROD_CONSUMPTION_WORKSPACE_ID }}
      GITHUB_ACTIONS: true
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e config/
          pip install -r config/requirements.txt

      # -----------------------------------------------------------------------
      # Step 1: Provision all Fabric infrastructure from template
      # Creates workspaces, lakehouses, capacities, git connections etc.
      # -----------------------------------------------------------------------
      - name: Provision Fabric infrastructure
        run: python config/scripts/generate_solution_from_yml_simple.py
        env:
          CONFIG_FILE: ${{ github.event.inputs.config_file }}

      # -----------------------------------------------------------------------
      # Step 2: Update GitHub Variables with live Fabric resource IDs
      # Fetches notebook IDs, environment IDs etc. from Fabric API
      # and writes them to GitHub Variables automatically.
      # -----------------------------------------------------------------------
      - name: Update GitHub Variables with Fabric resource IDs
        run: |
          if ("${{ github.event.inputs.environment }}" -eq "all") {
            python config/scripts/update_github_variables.py --all-environments
          } else {
            python config/scripts/update_github_variables.py `
              --environment "${{ github.event.inputs.environment }}"
          }
        shell: pwsh
        env:
          CONFIG_FILE: ${{ github.event.inputs.config_file }}
